<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)"/>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Outer Glow Hexagon Ring -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#accent-grad)" stroke-width="14" filter="url(#glow)"/>
  
  <!-- Core Symbol: CEO Star Hexagon -->
  <path d="M256 120 L370 186 V318 L256 384 L142 318 V186 Z" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linejoin="round"/>
  <path d="M256 160 L335 206 V298 L256 344 L177 298 V206 Z" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="10" stroke-linejoin="round"/>
  
  <!-- Center Star Emblem -->
  <path d="M256 195 L272 238 L318 245 L285 277 L293 322 L256 300 L219 322 L227 277 L194 245 L240 238 Z" fill="#fbbf24"/>
  
  <!-- Text Emblem -->
  <text x="256" y="435" font-family="sans-serif" font-size="38" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">CEO UMKM</text>
  <text x="256" y="468" font-family="sans-serif" font-size="20" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="2">DIGITAL PLATFORM</text>
</svg>
