<!DOCTYPE html>
<html lang="id" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CEO2024-DIGITAL UMKM | Teman Tepat UMKM Hebat</title>

    <!-- PWA Settings & Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CEO2024-DIGITAL UMKM">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="CEO2024-DIGITAL UMKM">
    <meta name="msapplication-TileColor" content="#059669">

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

    <!-- SEO & Social OpenGraph -->
    <meta name="description" content="Teman Tepat UMKM Hebat - Platform Produk Digital, Produk Fisik, Event & Solusi Bisnis UMKM Naik Kelas.">
    <meta property="og:title" content="CEO2024-DIGITAL UMKM">
    <meta property="og:description" content="Teman Tepat UMKM Hebat - Platform Produk Digital, Produk Fisik, Event & Solusi Bisnis UMKM Naik Kelas.">
    <meta property="og:image" content="icons/icon-512.png">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
            inset: 0;
        }

        /* Iframe Utama Full Screen (Langsung tampil instan tanpa preloader/splash) */
        #app-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            border: none;
            outline: none;
            display: block;
            z-index: 10;
            background-color: #f8fafc;
        }

        /* ================= FLOATING PWA INSTALL BANNER (ZERO ARTIFACTS) ================= */
        /* Default: display: none! Tidak dirender, tidak ada bayangan/garis nyangkut di atas */
        #pwa-banner {
            display: none;
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 45;
            width: calc(100% - 32px);
            max-width: 440px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 10px 14px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08), 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        /* Hanya tampil dan animasi saat class visible aktif */
        #pwa-banner.visible {
            display: flex !important;
            animation: pwaSlideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pwaSlideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-25px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .pwa-banner-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            margin-right: 12px;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .pwa-banner-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pwa-banner-info {
            flex: 1;
            min-width: 0;
        }

        .pwa-banner-title {
            font-size: 13px;
            font-weight: 800;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.2px;
        }

        .pwa-banner-desc {
            font-size: 11px;
            font-weight: 700;
            color: #d97706;
            margin-top: 1px;
        }

        .pwa-banner-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .btn-install {
            padding: 7px 14px;
            background: linear-gradient(135deg, #059669, #10b981);
            color: #ffffff;
            font-size: 12px;
            font-weight: 800;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(5, 150, 105, 0.35);
            transition: all 0.2s;
        }

        .btn-install:active {
            transform: scale(0.95);
        }

        .btn-close-banner {
            width: 28px;
            height: 28px;
            background: #f1f5f9;
            border: none;
            border-radius: 50%;
            color: #64748b;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-close-banner:hover {
            color: #0f172a;
            background: #e2e8f0;
        }

        /* Offline Bar */
        #offline-notice {
            display: none;
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 45;
            background: #ef4444;
            color: white;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 999px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        /* ================= DARK MODE OVERRIDES (ADAPTIVE) ================= */
        html.dark body {
            background-color: #020617;
            color: #f8fafc;
        }

        html.dark #app-frame {
            background-color: #020617;
        }

        html.dark #pwa-banner {
            background: rgba(15, 23, 42, 0.94);
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(16, 185, 129, 0.2);
        }

        html.dark .pwa-banner-title {
            color: #ffffff;
        }

        html.dark .pwa-banner-desc {
            color: #facc15;
        }

        html.dark .pwa-banner-icon {
            background: #020617;
            border-color: rgba(16, 185, 129, 0.5);
        }

        html.dark .btn-close-banner {
            background: rgba(255, 255, 255, 0.08);
            color: #94a3b8;
        }

        html.dark .btn-close-banner:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>

<body>

    <!-- Floating PWA Install Prompt (Default display: none; NO leak, NO shadow residue) -->
    <div id="pwa-banner">
        <div class="pwa-banner-icon">
            <img src="icons/icon-192.png" alt="App Icon" onerror="this.src='icons/icon.svg'">
        </div>
        <div class="pwa-banner-info">
            <div class="pwa-banner-title">CEO2024-DIGITAL UMKM</div>
            <div class="pwa-banner-desc">Teman Tepat UMKM Hebat</div>
        </div>
        <div class="pwa-banner-actions">
            <button type="button" class="btn-install" onclick="triggerPwaInstall()">Pasang</button>
            <button type="button" class="btn-close-banner" onclick="closePwaBanner()">&times;</button>
        </div>
    </div>

    <!-- Offline Status Indicator -->
    <div id="offline-notice">⚠️ Koneksi internet terputus (Offline)</div>

    <!-- Iframe Container Google Apps Script (Langsung tampil instan tanpa preloader) -->
    <iframe id="app-frame" 
            title="CEO2024 Digital UMKM WebApp"
            allow="camera; microphone; geolocation; payment; clipboard-read; clipboard-write; autoplay; fullscreen" 
            sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-downloads"
            loading="eager">
    </iframe>

    <script>
        // ========================================================
        // SINKRONISASI TEMA (LIGHT / DARK)
        // ========================================================
        const metaThemeColor = document.querySelector('meta[name="theme-color"]');

        function applyShellTheme(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
                if (metaThemeColor) metaThemeColor.setAttribute('content', '#020617');
            } else {
                document.documentElement.classList.add('light');
                document.documentElement.classList.remove('dark');
                if (metaThemeColor) metaThemeColor.setAttribute('content', '#ffffff');
            }
        }

        // Baca cache tema awal (default: light mode)
        try {
            const savedTheme = localStorage.getItem('landing_theme');
            if (savedTheme === 'dark') applyShellTheme(true);
            else applyShellTheme(false);
        } catch(e) {
            applyShellTheme(false);
        }

        // Tangkap event postMessage dari iframe saat tema di-toggle
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'THEME_CHANGE') {
                applyShellTheme(event.data.isDark);
            }
        });

        // ========================================================
        // KONFIGURASI URL GOOGLE APPS SCRIPT WEBAPP
        // ========================================================
        const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4tRpSIu6E_i_rzOuHkXK-brDN-GX0NGgXOuMCdlHdse_Va0A5rEXHeUiivhgcqwLUHA/exec";

        const frame = document.getElementById('app-frame');
        const pwaBanner = document.getElementById('pwa-banner');
        const offlineNotice = document.getElementById('offline-notice');

        // Meneruskan parameter query string dan hash dari domain ke AppScript
        const currentSearch = window.location.search || '';
        const currentHash = window.location.hash || '';
        frame.src = APPSCRIPT_URL + currentSearch + currentHash;

        // ========================================================
        // REGISTRASI SERVICE WORKER PWA
        // ========================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('Vercel PWA Shell Service Worker terdaftar:', registration.scope);
                    })
                    .catch((err) => {
                        console.warn('Vercel PWA Service Worker gagal didaftarkan:', err);
                    });
            });
        }

        // ========================================================
        // PWA BEFOREINSTALLPROMPT HANDLER
        // ========================================================
        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            console.log('beforeinstallprompt ditangkap di Vercel Wrapper');

            // Hanya tampilkan floating install banner di perangkat mobile/layar kecil setelah 2 detik
            const isMobile = window.innerWidth <= 768;
            if (isMobile) {
                setTimeout(() => {
                    if (pwaBanner) pwaBanner.classList.add('visible');
                }, 2000);
            }
        });

        window.addEventListener('appinstalled', () => {
            console.log('PWA CEO UMKM berhasil diinstall di perangkat!');
            deferredPrompt = null;
            if (pwaBanner) pwaBanner.classList.remove('visible');
        });

        function triggerPwaInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choice) => {
                    if (choice.outcome === 'accepted') {
                        console.log('User menginstal PWA');
                    }
                    deferredPrompt = null;
                    if (pwaBanner) pwaBanner.classList.remove('visible');
                });
            } else {
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (isIOS) {
                    alert('Untuk memasang di iPhone/iPad:\n1. Tekan tombol Share di Safari (ikon kotak panah ke atas).\n2. Pilih "Add to Home Screen" (Tambah ke Layar Utama).\n3. Tekan "Add".');
                } else {
                    alert('Untuk memasang di HP:\nTekan menu titik tiga (⋮) di pojok kanan atas browser lalu pilih "Pasang aplikasi" / "Tambahkan ke Layar Utama".');
                }
            }
        }

        function closePwaBanner() {
            if (pwaBanner) pwaBanner.classList.remove('visible');
        }

        // ========================================================
        // DETEKSI KONEKSI ONLINE / OFFLINE
        // ========================================================
        window.addEventListener('online', () => {
            if (offlineNotice) offlineNotice.style.display = 'none';
        });

        window.addEventListener('offline', () => {
            if (offlineNotice) offlineNotice.style.display = 'block';
        });
    </script>
</body>

</html>
